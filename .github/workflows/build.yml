name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: build:mac
          - os: windows-latest
            build: build:win
          - os: windows-latest
            build: build:win:arm64
          - os: ubuntu-latest
            build: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: ow-bridge-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            release/*.zip
            release/*.exe
            release/*.AppImage
